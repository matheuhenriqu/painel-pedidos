  <style>
    /* Altura Dinâmica e Safe-Area Insets para Mobile */
    html, body {
      min-height: 100%;
      min-height: 100dvh;
    }
    @supports (-webkit-touch-callout: none) {
      .h-dvh { height: 100dvh; }
    }
    .safe-area-bottom {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    /* Estilização da barra de rolagem */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }

    /* Efeitos de Glassmorphism */
    .glass-surface {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .dark .glass-surface {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Animação suave para novas mensagens */
    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .animate-msg {
      animation: messageSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Animação de pulso para o status de IA */
    @keyframes pulseAi {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    .pulse-ai {
      animation: pulseAi 2s infinite ease-in-out;
    }

    /* Indicador de digitação */
    .dot-flashing {
      position: relative;
      width: 6px;
      height: 6px;
      border-radius: 5px;
      background-color: #6366f1;
      color: #6366f1;
      animation: dotFlashing 1s infinite linear alternate;
      animation-delay: .5s;
    }
    .dot-flashing::before, .dot-flashing::after {
      content: '';
      display: inline-block;
      position: absolute;
      top: 0;
      width: 6px;
      height: 6px;
      border-radius: 5px;
      background-color: #6366f1;
      color: #6366f1;
    }
    .dot-flashing::before {
      left: -10px;
      animation: dotFlashing 1s infinite alternate;
      animation-delay: 0s;
    }
    .dot-flashing::after {
      left: 10px;
      animation: dotFlashing 1s infinite alternate;
      animation-delay: 1s;
    }
    @keyframes dotFlashing {
      0% { background-color: #6366f1; }
      50%, 100% { background-color: rgba(99, 102, 241, 0.2); }
    }
  </style>
</head>

  <script>
    // ==============================================================================
    // CONFIGURAÇÃO DO SUPABASE & AMBIENTE
    // ==============================================================================
    const SUPABASE_URL = 'https://pwyytcyofxtriulqesqm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_vk-vctYaPnPRm0fWlRkcTQ_RtYigr2L';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ESTADO DA CONVERSA E DADOS DO PEDIDO
    let dadosPedidoEmConstrucao = {
      cliente: '',
      telefone: '',
      setor: 'Geral',
      servico: '',
      valor: 0,
      data_pedido: '',
      observacoes: ''
    };

    let etapaColetaAtual = 'inicio'; // 'inicio', 'nome', 'telefone', 'servico', 'setor', 'data', 'confirmacao', 'finalizado'
    let historicoMensagens = [];
    let somHabilitado = true;
    let configuracaoChat = {
      nomeEmpresa: 'Nossa Empresa',
      groqApiKey: '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',
      modeloIa: 'qwen/qwen3.8-27b',
      setoresDisponiveis: ['Oficina', 'Pet Shop', 'Informática', 'Vendas', 'Manutenção', 'Design', 'Geral']
    };

    // ==============================================================================
    // INICIALIZAÇÃO DO TEMA E CONFIGURAÇÕES
    // ==============================================================================
    function carregarConfiguracoes() {
      try {
        const temaSalvo = localStorage.getItem('tema_preferido');
        if (temaSalvo === 'dark' || (!temaSalvo && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        const somSalvo = localStorage.getItem('chat_som_habilitado');
        if (somSalvo !== null) {
          somHabilitado = somSalvo === 'true';
        }
        atualizarIconeSom();

        const configLocal = localStorage.getItem('painel_chat_config');
        if (configLocal) {
          const parse = JSON.parse(configLocal);
          configuracaoChat = { ...configuracaoChat, ...parse };
        }

        // Chave Groq via URL param se fornecida (ou chave customizada)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('groq_key')) {
          configuracaoChat.groqApiKey = urlParams.get('groq_key');
        } else if (urlParams.has('gemini_key') && !configuracaoChat.groqApiKey) {
          configuracaoChat.groqApiKey = urlParams.get('gemini_key');
        }
        if (urlParams.has('model')) {
          configuracaoChat.modeloIa = urlParams.get('model');
        }

        if (configuracaoChat.nomeEmpresa && configuracaoChat.nomeEmpresa !== 'Nossa Empresa') {
          const tit = document.getElementById('chat-empresa-titulo');
          if (tit) tit.textContent = configuracaoChat.nomeEmpresa;
        }
      } catch (e) {
        console.warn('Erro ao carregar configurações do chat:', e);
      }
    }

    function alternarTema() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('tema_preferido', isDark ? 'dark' : 'light');
    }

    function alternarSomChat() {
      somHabilitado = !somHabilitado;
      localStorage.setItem('chat_som_habilitado', somHabilitado ? 'true' : 'false');
      atualizarIconeSom();
      if (somHabilitado) emitirSom('msg');
    }

    function atualizarIconeSom() {
      const on = document.getElementById('icon-som-on');
      const off = document.getElementById('icon-som-off');
      if (on && off) {
        if (somHabilitado) {
          on.classList.remove('hidden');
          off.classList.add('hidden');
        } else {
          on.classList.add('hidden');
          off.classList.remove('hidden');
        }
      }
    }

    // FEEDBACK SONORO SINTETIZADO (WEB AUDIO API - ZERO DEPENDÊNCIAS EXTERNAS)
    function emitirSom(tipo = 'msg') {
      if (!somHabilitado) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        if (tipo === 'msg') {
          // Bip suave e acolhedor de mensagem nova
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12); // A5
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (tipo === 'sucesso') {
          // Acorde alegre de celebração de pedido
          const notas = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          notas.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + (idx * 0.08));
            gain.gain.setValueAtTime(0.09, ctx.currentTime + (idx * 0.08));
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (idx * 0.08) + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + (idx * 0.08));
            osc.stop(ctx.currentTime + (idx * 0.08) + 0.35);
          });
        }
      } catch (e) {
        // Ignora silenciosamente se o navegador bloquear autoplay
      }
    }

    // ==============================================================================
    // RENDERIZAÇÃO DE MENSAGENS E BALÕES
    // ==============================================================================
    function rolarParaFim() {
      const container = document.getElementById('chat-mensagens-container');
      if (container) {
        setTimeout(() => {
          container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }, 60);
      }
    }

    function formatarHoraAtual() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(texto) {
      if (texto === null || texto === undefined) return '';
      return String(texto)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Adiciona mensagem no histórico e na tela
    function adicionarMensagem(remetente, conteudoHtml, meta = {}) {
      const container = document.getElementById('chat-mensagens-container');
      if (!container) return;

      const hora = formatarHoraAtual();
      const divMsg = document.createElement('div');

    // ==============================================================================
    // MOTOR DE IA CONVERSACIONAL INTELIGENTE (NLP + GROQ QWEN 3.8 27B)
    // ==============================================================================

    // Extração inteligente de entidades via Regex / Padrões comuns em Português
    function extrairEntidadesTexto(texto) {
      const extraido = {};

      // 1. Extração de Telefone / WhatsApp (ex: (11) 98765-4321, 11988887777, 21 9999-8888)
      const telRegex = /(?:\+?55\s?)?(?:\(?([1-9]{2})\)?\s?)?(?:(9\d{4})[-\s]?(\d{4})|(\d{4})[-\s]?(\d{4}))/g;
      const matchTel = telRegex.exec(texto);
      if (matchTel && matchTel[0].replace(/\D/g, '').length >= 8) {
        const digitos = matchTel[0].replace(/\D/g, '');
        if (digitos.length === 11) {
          extraido.telefone = `(${digitos.slice(0,2)}) ${digitos.slice(2,7)}-${digitos.slice(7)}`;
        } else if (digitos.length === 10) {
          extraido.telefone = `(${digitos.slice(0,2)}) ${digitos.slice(2,6)}-${digitos.slice(6)}`;
        } else {
          extraido.telefone = matchTel[0].trim();
        }
      }

      // 2. Extração de Nome próprio ("Meu nome é...", "Sou o...", "Me chamo...")
      const nomeRegex = /(?:meu\s+nome\s+é|me\s+chamo|sou\s+o|sou\s+a|falar\s+com)\s+([A-ZÁÉÍÓÚÂÊÎÔÛÃÕÇa-záéíóúâêîôûãõç\s]+?)(?=\s+(?:e\s+meu|e\s+o|meu\s+whatsapp|meu\s+zap|meu\s+tel|telefone|whatsapp|zap|contato|\(|\d)|[,\.\n]|$)/i;
      const matchNome = texto.match(nomeRegex);
      if (matchNome && matchNome[1]) {
        const limpo = matchNome[1].split(/[,\.\n]/)[0].trim();
        if (limpo.length > 2 && !limpo.includes('pedido') && !limpo.includes('gostaria')) {
          extraido.cliente = limpo;
        }
      }

      // 3. Extração de Valor em R$ ou reais
      const valorRegex = /(?:r\$\s*|valor\s*(?:de\s*)?|preco\s*(?:de\s*)?|por\s*)(\d+(?:[\.,]\d{2})?)/i;
      const matchValor = texto.match(valorRegex);
      if (matchValor && matchValor[1]) {
        extraido.valor = parseFloat(matchValor[1].replace(',', '.'));
      }

      // 4. Extração de Data / Horário ("para amanhã às 14h", "sexta-feira", "hoje", etc.)
      const dataRegex = /(?:para\s+|no\s+dia\s+|em\s+)?(hoje|amanhã|depois\s+de\s+amanhã|segunda(?:-feira)?|terça(?:-feira)?|quarta(?:-feira)?|quinta(?:-feira)?|sexta(?:-feira)?|sábado|domingo|\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)(?:\s+(?:às|as)\s+\d{1,2}(?:h|:\d{2})?)?/i;
      const matchData = texto.match(dataRegex);
      if (matchData && matchData[0]) {
        extraido.data_pedido = matchData[0].trim();
      }

      // 5. Mapeamento de Setor / Categoria
      const setores = configuracaoChat.setoresDisponiveis || [];
      for (const s of setores) {
        if (new RegExp(`\\b${s}\\b`, 'i').test(texto)) {
          extraido.setor = s;
          break;
        }
      }

      return extraido;
    }

    // Inicialização da Conversa

    // Processamento central da mensagem
    async function processarEnvioMensagem(texto) {
      // Extrai as iniciais do nome se já tiver cliente
      let iniciais = 'EU';
      if (dadosPedidoEmConstrucao.cliente) {
        const p = dadosPedidoEmConstrucao.cliente.trim().split(/\s+/);
        iniciais = p.length > 1 ? (p[0][0] + p[p.length - 1][0]).toUpperCase() : p[0].slice(0, 2).toUpperCase();
      }

      adicionarMensagem('usuario', texto, { iniciais });
      exibirDigitando(true);
      atualizarSugestoes([]);

      // Simulação de processamento inteligente da IA (latência natural de diálogo)
      setTimeout(async () => {
        try {
          await executarLogicaRespostaIA(texto);
        } catch (err) {
          console.error('Erro na resposta da IA:', err);
          adicionarMensagem('bot', 'Desculpe, tive uma instabilidade momentânea ao processar sua resposta. Pode repetir, por favor?');
        } finally {
          exibirDigitando(false);
        }
      }, 700);
    }

    // LÓGICA CONVERSACIONAL DE COLETA DE DADOS DO PEDIDO
    async function executarLogicaRespostaIA(texto) {
      const textoLower = texto.toLowerCase();
      const entidades = extrairEntidadesTexto(texto);

      // Se a IA tiver chave do Groq configurada, processar com Qwen 3.8 27B em nível máximo de raciocínio
      if (configuracaoChat.groqApiKey && configuracaoChat.groqApiKey.trim().length > 10) {
        const chamadaGroq = await tentarProcessarComGroqQwen(texto);
        if (chamadaGroq) {
          return;
        }
      }

      // Fluxo Nativo Especializado e Ultrarrápido

      // Se o cliente quer reiniciar ou cancelar
      if (textoLower.includes('cancelar') || textoLower.includes('recomeçar') || textoLower.includes('reiniciar')) {
        reiniciarConversa();
        return;
      }

      // Coleta em Estágios
      if (etapaColetaAtual === 'inicio' || etapaColetaAtual === 'nome') {
        let nome = entidades.cliente;
        if (!nome) {
          // Se for resposta direta com apenas o nome (ex: "Carlos Eduardo" ou "Sou Maria")
          const limpo = texto.replace(/^(olá|oi|bom dia|boa tarde|boa noite|sou|meu nome é|me chamo|o meu é)\s*/i, '').trim();
          if (limpo.length >= 2 && !limpo.includes('pedido')) {
            nome = limpo;
          }
        }

        if (nome) {
          dadosPedidoEmConstrucao.cliente = nome;
          // Se na mesma mensagem o cliente já passou o telefone
          if (entidades.telefone) dadosPedidoEmConstrucao.telefone = entidades.telefone;
          if (entidades.servico) dadosPedidoEmConstrucao.servico = entidades.servico;

          etapaColetaAtual = 'telefone';
          if (!dadosPedidoEmConstrucao.telefone) {
            adicionarMensagem('bot', `
              Prazer em te conhecer, <strong>${escapeHtml(nome)}</strong>! 😊<br/>
              Para que possamos entrar em contato e enviar atualizações do seu pedido, qual é o seu <strong>número de WhatsApp ou telefone</strong>?
            `);
            atualizarSugestoes([
              { texto: '(11) 99999-8888', icone: '📱' },
              { texto: 'Prefiro informar depois', icone: '⏩' }
            ]);
            return;
          }
        } else {
          adicionarMensagem('bot', `Olá! Para iniciarmos seu pedido, por favor, me informe o seu <strong>nome completo</strong>.`);
          return;
        }
      }

      if (etapaColetaAtual === 'telefone') {
        let tel = entidades.telefone;
        if (!tel) {
          const apenasNumeros = texto.replace(/\D/g, '');
          if (apenasNumeros.length >= 8) {
            tel = texto.trim();
          } else if (textoLower.includes('depois') || textoLower.includes('pular') || textoLower.includes('não')) {
            tel = 'Não informado';
          }
        }

        if (tel) {
          dadosPedidoEmConstrucao.telefone = tel;
          etapaColetaAtual = 'servico';
          adicionarMensagem('bot', `
            Perfeito, contato salvo! 📝<br/>
            Agora me conte: <strong>qual serviço ou produto você gostaria de solicitar?</strong><br/>
            <span class="text-xs text-slate-400">Pode detalhar o que precisa (Ex: Troca de óleo, Banho e tosa, Formatação, Criação de Banner, etc.)</span>
          `);
          atualizarSugestoes([
            { texto: 'Manutenção Geral', icone: '🛠️' },
            { texto: 'Atendimento de Suporte', icone: '💻' },
            { texto: 'Orçamento Personalizado', icone: '📋' }
          ]);
          return;
        } else {
          adicionarMensagem('bot', `Por favor, informe seu número de telefone ou WhatsApp (ex: <em>(11) 98765-4321</em>) para facilitar nosso contato.`);
          return;
        }
      }

      if (etapaColetaAtual === 'servico') {
        dadosPedidoEmConstrucao.servico = texto;
        if (entidades.setor) dadosPedidoEmConstrucao.setor = entidades.setor;
        if (entidades.data_pedido) dadosPedidoEmConstrucao.data_pedido = entidades.data_pedido;
        if (entidades.valor) dadosPedidoEmConstrucao.valor = entidades.valor;

        etapaColetaAtual = 'setor';
        const setores = configuracaoChat.setoresDisponiveis || ['Geral', 'Oficina', 'Vendas'];
        
        adicionarMensagem('bot', `
          Excelente! Entendi sua solicitação: <strong>"${escapeHtml(texto)}"</strong>. 🎯<br/><br/>
          A qual <strong>setor ou categoria</strong> esse pedido melhor se encaixa? Clique em uma das opções abaixo ou digite:
        `);

        atualizarSugestoes(setores.map(s => ({ texto: s, valor: s, icone: '🏷️' })));
        return;
      }

      if (etapaColetaAtual === 'setor') {
        dadosPedidoEmConstrucao.setor = texto.trim() || 'Geral';
        etapaColetaAtual = 'data';

        adicionarMensagem('bot', `
          Setor definido como <strong>${escapeHtml(dadosPedidoEmConstrucao.setor)}</strong>. ✅<br/>
          Para quando você gostaria de agendar ou receber esse pedido? (Ex: <em>Hoje</em>, <em>Amanhã às 14h</em>, <em>Sexta-feira</em>, etc.)
        `);

        atualizarSugestoes([
          { texto: 'Hoje o mais breve possível', icone: '⚡' },
          { texto: 'Amanhã pela manhã', icone: '🌅' },
          { texto: 'Amanhã à tarde (14h)', icone: '🕒' },
          { texto: 'Próxima semana', icone: '📅' }
        ]);
        return;
      }

      if (etapaColetaAtual === 'data') {
        dadosPedidoEmConstrucao.data_pedido = texto.trim();
        etapaColetaAtual = 'observacoes';

        adicionarMensagem('bot', `
          Agendamento registrado para <strong>${escapeHtml(dadosPedidoEmConstrucao.data_pedido)}</strong>. 📅<br/>
          Você gostaria de adicionar alguma <strong>observação especial</strong>, endereço para entrega ou detalhe adicional? Se não houver, pode responder "Não".
        `);

        atualizarSugestoes([
          { texto: 'Sem observações adicionais', icone: '👍' },
          { texto: 'Preciso de nota fiscal', icone: '🧾' },
          { texto: 'Entregar em endereço residencial', icone: '📍' }
        ]);
        return;
      }

      if (etapaColetaAtual === 'observacoes') {
        if (!textoLower.includes('não') && !textoLower.includes('nao') && !textoLower.includes('nenhuma') && !textoLower.includes('sem observações')) {
          dadosPedidoEmConstrucao.observacoes = texto.trim();
        } else {
          dadosPedidoEmConstrucao.observacoes = 'Nenhuma observação informada.';
        }

        etapaColetaAtual = 'confirmacao';
        exibirCardResumoConfirmacao();
        return;
      }

      if (etapaColetaAtual === 'confirmacao') {
        if (textoLower.includes('sim') || textoLower.includes('confirmar') || textoLower.includes('ok') || textoLower.includes('enviar') || textoLower.includes('pode')) {
          await confirmarECriarPedidoNoSupabase();
        } else if (textoLower.includes('alterar') || textoLower.includes('mudar') || textoLower.includes('corrigir')) {
          adicionarMensagem('bot', `O que você gostaria de alterar? Me diga o novo valor, serviço, telefone ou data que atualizarei imediatamente para você.`);
        } else {
          // Tenta aplicar atualização com base no que foi dito
          if (entidades.telefone) dadosPedidoEmConstrucao.telefone = entidades.telefone;
          if (entidades.data_pedido) dadosPedidoEmConstrucao.data_pedido = entidades.data_pedido;
          if (entidades.cliente) dadosPedidoEmConstrucao.cliente = entidades.cliente;
          if (entidades.valor) dadosPedidoEmConstrucao.valor = entidades.valor;

          adicionarMensagem('bot', `Informações atualizadas! Confira o resumo abaixo e clique em <strong>Confirmar Pedido</strong>.`);
          exibirCardResumoConfirmacao();
        }
      }
    }

    // CRIAÇÃO AUTOMÁTICA DO PEDIDO NA TABELA SUPABASE
    // ==============================================================================
    async function confirmarECriarPedidoNoSupabase() {
      exibirDigitando(true);
      atualizarSugestoes([]);

      const p = dadosPedidoEmConstrucao;
      const payload = {
        cliente: p.cliente || 'Cliente Chatbot',
        telefone: p.telefone || 'Não informado',
        setor: p.setor || 'Geral',
        servico: p.servico || 'Solicitação via Chatbot',
        valor: parseFloat(p.valor) || 0,
        data_pedido: p.data_pedido || new Date().toLocaleDateString('pt-BR'),
        status: 'Pendente',
        observacoes: (p.observacoes || '') + ' [Criado automaticamente via Chatbot IA]',
        user_id: null // Cliente público / visitante
      };

      try {
        const { data, error } = await supabaseClient
          .from('pedidos')
          .insert([payload])
          .select();

        if (error) throw error;

        const novoPedido = (data && data[0]) ? data[0] : null;
        const idGerado = novoPedido ? novoPedido.id : Math.floor(1000 + Math.random() * 9000);

        etapaColetaAtual = 'finalizado';
        emitirSom('sucesso');

        // Dispara celebração de confetes
        if (window.confetti) {
          confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 }
          });
        }

        const msgSucesso = `
          <div class="space-y-3">
            <div class="p-3 bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800/80 rounded-2xl flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center shrink-0 shadow-md">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
              </div>
              <div>
                <h3 class="text-sm font-extrabold text-emerald-800 dark:text-emerald-300">Pedido #${idGerado} Registrado com Sucesso! 🎉</h3>
                <p class="text-xs text-emerald-700 dark:text-emerald-400">Nossa equipe já recebeu sua solicitação em tempo real.</p>
              </div>
            </div>

            <div class="text-xs text-slate-600 dark:text-slate-300 space-y-1.5 bg-slate-50 dark:bg-slate-900/60 p-3 rounded-xl border border-slate-200/80 dark:border-slate-800">
              <p><strong>Número do Pedido:</strong> #${idGerado}</p>
              <p><strong>Cliente:</strong> ${escapeHtml(payload.cliente)}</p>
              <p><strong>Serviço:</strong> ${escapeHtml(payload.servico)}</p>
              <p><strong>Status:</strong> <span class="px-2 py-0.5 rounded-full bg-amber-100 dark:bg-amber-950/80 text-amber-800 dark:text-amber-300 font-bold text-[10px]">Pendente de Atendimento</span></p>
            </div>

            <div class="flex flex-col sm:flex-row items-center gap-2 pt-2">
              <a 
                href="https://api.whatsapp.com/send?text=${encodeURIComponent(`Olá! Acabei de registrar meu pedido #${idGerado} (${payload.servico}) com vocês pelo Assistente Virtual.`)}"
                target="_blank"
                class="w-full sm:w-auto flex-1 py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition active:scale-95 flex items-center justify-center gap-1.5 shadow-sm"
              >
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                <span>Enviar Comprovante WhatsApp</span>
              </a>

              <button 
                type="button"
                onclick="reiniciarConversa()"
                class="w-full sm:w-auto py-2.5 px-4 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-bold rounded-xl text-xs transition cursor-pointer"
              >
                <span>Fazer Outro Pedido</span>
              </button>
            </div>
          </div>
        `;

        adicionarMensagem('bot', msgSucesso);
      } catch (err) {
        console.error('Erro ao cadastrar pedido no Supabase:', err);
        adicionarMensagem('bot', `
          <div class="p-3 bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-800 rounded-xl text-rose-800 dark:text-rose-300 text-xs">
            <strong>Não foi possível gravar o pedido automaticamente:</strong><br/>
            ${escapeHtml(err.message || 'Erro de conexão com o banco')}.<br/>
            Por favor, verifique a conexão ou clique no botão abaixo para tentar novamente.
          </div>
          <button onclick="confirmarECriarPedidoNoSupabase()" class="mt-2 py-2 px-4 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold rounded-xl">Tentar Novamente</button>
        `);
      } finally {
        exibirDigitando(false);
      }
    }

    // ==============================================================================
    // INTEGRAÇÃO COM GROQ API (QWEN 3.8 27B - MÁXIMO NÍVEL DE RACIOCÍNIO)
    // ==============================================================================
    async function tentarProcessarComGroqQwen(textoUsuario) {
      if (!configuracaoChat.groqApiKey) return false;

      // Modelos em ordem de máxima capacidade analítica no Groq
      const modelos = [configuracaoChat.modeloIa || 'qwen/qwen3.8-27b', 'qwen/qwen3.6-27b'];

      const promptSistema = `
Você é o assistente virtual de inteligência artificial de alta performance da empresa "${configuracaoChat.nomeEmpresa}", operando via Groq LPU com o modelo Qwen 3.8 27B no MÁXIMO NÍVEL DE RACIOCÍNIO ANALÍTICO E EMPATIA.
Seu objetivo é conduzir um atendimento excepcional, ágil e resolutivo para coletar e estruturar todos os dados necessários para o registro de um novo pedido no sistema:
- Nome do cliente
- Telefone / WhatsApp para contato
- Descrição do Serviço ou Produto solicitado
- Setor ou Categoria (opções disponíveis: ${(configuracaoChat.setoresDisponiveis || []).join(', ')})
- Data e horário de preferência de execução/entrega
- Valor estimado (se informado pelo cliente, ou 0 para orçamento)
- Observações adicionais, endereço ou especificidades

Dados já coletados anteriormente no atendimento:
${JSON.stringify(dadosPedidoEmConstrucao)}

Mensagem recebida do cliente agora: "${textoUsuario}".

DIRETRIZES DE MÁXIMO RACIOCÍNIO ANALÍTICO:
1. Analise o contexto da conversa e deduza informações implícitas (ex: se o cliente cita "pastilhas de freio", "troca de óleo" ou "alinhamento", o setor é Oficina; se cita "vacina", "ração" ou "tosa", Pet Shop; se cita "formatação" ou "computador", Informática).
2. Se o cliente tiver dúvidas sobre prazos, formas de pagamento ou detalhes técnicos, responda de forma prestativa, transparente e acolhedora.
3. Se o cliente estiver confirmando o pedido (ex: "sim", "pode confirmar", "está certo", "ok", "enviar pedido", "pode agendar"), defina "clienteConfirmou": true.
4. Se Nome, Telefone e Serviço já foram identificados ou informados agora, defina "prontoParaConfirmar": true.

Retorne ESTRITAMENTE um objeto JSON válido (sem blocos markdown de código e sem texto antes ou depois) no formato:
{
  "raciocinio": "Resumo do raciocínio analítico sobre as necessidades do cliente",
  "mensagem": "Sua resposta altamente profissional, empática e acolhedora para o cliente",
  "dadosAtualizados": {
    "cliente": "Nome do cliente",
    "telefone": "Telefone/WhatsApp",
    "servico": "Serviço solicitado",
    "setor": "Setor mais adequado",
    "data_pedido": "Data e horário",
    "valor": 0,
    "observacoes": "Observações relevantes"
  },
  "prontoParaConfirmar": false,
  "clienteConfirmou": false
}
`;

      for (const modelo of modelos) {
        try {
          const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${configuracaoChat.groqApiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: modelo,
              reasoning_effort: 'high',
              messages: [
                { role: 'system', content: promptSistema },
                { role: 'user', content: textoUsuario }
              ],
              temperature: 0.15
            })
          });

          if (!res.ok) {
            console.warn(`Modelo Groq ${modelo} retornou status ${res.status}, tentando próximo...`);
            continue;
          }

          const json = await res.json();
          const choice = json.choices?.[0]?.message;
          const rawText = choice?.content;
          if (!rawText) continue;

          // Registro do raciocínio analítico gerado pelo Qwen 3.8
          if (choice.reasoning) {
            console.info(`[Qwen 3.8 27B Reasoning]:`, choice.reasoning);
          }

          let respostaObj = null;
          try {
            const cleanJson = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
            respostaObj = JSON.parse(cleanJson);
          } catch (parseErr) {
            respostaObj = {
              mensagem: rawText,
              dadosAtualizados: {},
              prontoParaConfirmar: false,
              clienteConfirmou: false
            };
          }

          if (respostaObj && respostaObj.mensagem) {
            // Mescla dados estruturados extraídos pelo raciocínio do Qwen 3.8
            if (respostaObj.dadosAtualizados) {
              const d = respostaObj.dadosAtualizados;
              if (d.cliente && d.cliente.trim() && d.cliente !== 'Não informado') dadosPedidoEmConstrucao.cliente = d.cliente.trim();
              if (d.telefone && d.telefone.trim() && d.telefone !== 'Não informado') dadosPedidoEmConstrucao.telefone = d.telefone.trim();
              if (d.servico && d.servico.trim()) dadosPedidoEmConstrucao.servico = d.servico.trim();
              if (d.setor && d.setor.trim()) dadosPedidoEmConstrucao.setor = d.setor.trim();
              if (d.data_pedido && d.data_pedido.trim()) dadosPedidoEmConstrucao.data_pedido = d.data_pedido.trim();
              if (d.valor) dadosPedidoEmConstrucao.valor = parseFloat(d.valor) || 0;
              if (d.observacoes && d.observacoes.trim()) dadosPedidoEmConstrucao.observacoes = d.observacoes.trim();
            }

            // Fallback de segurança com o extrator local
            const entidadesLocais = extrairEntidadesTexto(textoUsuario);
            if (entidadesLocais.cliente && !dadosPedidoEmConstrucao.cliente) dadosPedidoEmConstrucao.cliente = entidadesLocais.cliente;
            if (entidadesLocais.telefone && !dadosPedidoEmConstrucao.telefone) dadosPedidoEmConstrucao.telefone = entidadesLocais.telefone;
            if (entidadesLocais.data_pedido && !dadosPedidoEmConstrucao.data_pedido) dadosPedidoEmConstrucao.data_pedido = entidadesLocais.data_pedido;
            if (entidadesLocais.setor && dadosPedidoEmConstrucao.setor === 'Geral') dadosPedidoEmConstrucao.setor = entidadesLocais.setor;

            // Se o cliente confirmou o pedido via raciocínio analítico
            if (respostaObj.clienteConfirmou) {
              await confirmarECriarPedidoNoSupabase();
              return true;
            }

            // Renderiza a resposta refinada do Qwen
            adicionarMensagem('bot', respostaObj.mensagem.replace(/\n/g, '<br/>'));

            // Se estiver pronto para confirmação ou tiver os 3 dados vitais
            if (respostaObj.prontoParaConfirmar || (dadosPedidoEmConstrucao.cliente && dadosPedidoEmConstrucao.telefone && dadosPedidoEmConstrucao.servico)) {
              etapaColetaAtual = 'confirmacao';
              exibirCardResumoConfirmacao();
            }

            return true;
          }
        } catch (errModelo) {
          console.warn(`Erro no modelo Groq ${modelo}:`, errModelo);
        }
      }
      return false;
    }
  </script>
